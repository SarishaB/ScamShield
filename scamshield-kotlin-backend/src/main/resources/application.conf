ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.bitwiseoperators.scamshield.ApplicationKt.module ]
    }
}

scamshield {
    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/scamshield"
        jdbcUrl = ${?DATABASE_URL}
        username = "scamshield"
        username = ${?DATABASE_USER}
        password = "scamshield"
        password = ${?DATABASE_PASSWORD}
        maximumPoolSize = 10
    }

    virustotal {
        apiKey = "3de6e6d65c71c44a501f3b7a58c605721bd7a1bee4b652804125a8e267a52680"
        apiKey = ${?VIRUSTOTAL_API_KEY}
    }

    // ADD THIS NEW BLOCK HERE
    deepseek {
        apiKey = "sk-22beb0afa32e45c0843d0a9417366ea4"
        apiKey = ${?DEEPSEEK_API_KEY}
        baseUrl = "https://api.deepseek.com"
    }

    ocr {
        enabled = true
        enabled = ${?OCR_ENABLED}
        command = "tesseract"
        command = ${?TESSERACT_COMMAND}
        language = "eng"
        language = ${?TESSERACT_LANGUAGE}
    }

    upload {
        maxBytes = 10485760
    }

    security {
        apiKey = ""
        apiKey = ${?SCAMSHIELD_API_KEY}
    }
}
