ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.bitwiseoperators.scamshield.ApplicationKt.module ]
    }
}

scamshield {
    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/scamshield"
        jdbcUrl = ${?DATABASE_URL}
        username = "scamshield"
        username = ${?DATABASE_USER}
        password = "ScamShield123!"
        maximumPoolSize = 10
    }

    virustotal {
        apiKey = ""
        apiKey = ${?VIRUSTOTAL_API_KEY}
    }

    gemini {
        # Create this key in Google AI Studio and set GEMINI_API_KEY.
        apiKey = "AQ.Ab8RN6LFeLJn_pvMXt1CTvMV60d9iZxaGKRMSuOmtCdep2Navw"
        apiKey = ${?GEMINI_API_KEY}
        model = "gemini-3.6-flash"
        model = ${?GEMINI_MODEL}
        baseUrl = "https://generativelanguage.googleapis.com/v1beta"
        baseUrl = ${?GEMINI_BASE_URL}
    }

    ocr {
        # OCR.Space cloud OCR. Set OCR_SPACE_API_KEY for the backend.
        enabled = true
        enabled = ${?OCR_ENABLED}
        apiKey = "K86752152388957"
        apiKey = ${?OCR_SPACE_API_KEY}
        baseUrl = "https://api.ocr.space/parse/image"
        baseUrl = ${?OCR_SPACE_BASE_URL}
        language = "eng"
        language = ${?OCR_LANGUAGE}
        engine = 2
        engine = ${?OCR_ENGINE}
    }

    upload {
        maxBytes = 10485760
    }

    security {
        apiKey = ""
        apiKey = ${?SCAMSHIELD_API_KEY}
    }
}
