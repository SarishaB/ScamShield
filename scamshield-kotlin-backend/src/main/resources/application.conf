ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.bitwiseoperators.scamshield.ApplicationKt.module ]
    }
}

scamshield {
    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/scamshield"
        jdbcUrl = ${?DATABASE_URL}
        username = "scamshield"
        username = ${?DATABASE_USER}
        password = "scamshield"
        password = ${?DATABASE_PASSWORD}
        maximumPoolSize = 10
    }

    virustotal {
        apiKey = ""
        apiKey = ${?VIRUSTOTAL_API_KEY}
    }

    ocr {
        enabled = true
        enabled = ${?OCR_ENABLED}
        command = "tesseract"
        command = ${?TESSERACT_COMMAND}
        language = "eng"
        language = ${?TESSERACT_LANGUAGE}
    }

    upload {
        maxBytes = 10485760
    }

    security {
        apiKey = ""
        apiKey = ${?SCAMSHIELD_API_KEY}
    }
}
